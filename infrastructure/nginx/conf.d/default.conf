upstream frontend {
    server frontend:3000;
    keepalive 64;
}

upstream backend {
    server backend:8000;
    keepalive 64;
}

server {
    listen 80 default_server;
    server_name _;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none';" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    location /health {
        proxy_pass http://backend/health;
        access_log off;
    }

    location /readiness {
        proxy_pass http://backend/readiness;
        access_log off;
    }

    location /liveness {
        proxy_pass http://backend/liveness;
        access_log off;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
    }

    location / {
        proxy_pass http://frontend;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        sub_filter '</head>' '<meta name="csrf-token" content="$request_id"></head>';
        sub_filter_once on;
    }

    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}
